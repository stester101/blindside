<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Blindside</title>
  <meta name="description" content="Spoiler-free fantasy football tracker for Fleaflicker">
  <meta name="theme-color" content="#060a12">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="appbar">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="40" height="40">
      <div>
        <div class="wordmark">BLINDSIDE</div>
        <div class="tag">Fantasy NFL · Spoiler-Free</div>
      </div>
    </div>
    <div class="barbtns">
      <button id="btn-refresh" class="iconbtn lg" type="button" aria-label="Refresh data"></button>
      <button id="btn-settings" class="iconbtn lg" type="button" aria-label="Settings"></button>
    </div>
  </header>
  <main id="app" aria-live="polite">
    <p class="muted center pad">Loading…</p>
  </main>
  <nav id="nav" class="bottomnav" aria-label="Sections" hidden></nav>
  <script type="module" src="app.js"></script>
</body>
</html>
